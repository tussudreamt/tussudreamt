name: Node.js CI

# Trigger the workflow on push or pull request events for the "main" branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Specify the operating system the runner will use
    runs-on: ubuntu-latest

    # Run tests across multiple Node.js versions
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    # Step 1: Check out the repository code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up the Node.js environment
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    # Step 3: Install project dependencies safely
    - name: Install dependencies
      run: npm ci

    # Step 4: Build the project (if a build script exists)
    - name: Run build
      run: npm run build --if-present

    # Step 5: Run tests
    - name: Run tests
      run: npm test
